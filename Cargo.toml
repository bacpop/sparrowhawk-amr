[package]
name = "sparrowhawk-amr"
version = "0.1.0"
edition = "2024"
description = "Offline k-mer detector of antimicrobial resistance genes based on the AMRFinderPlus database, native and WebAssembly"
repository = "https://github.com/bacpop/sparrowhawk-amr"
homepage = "https://bacpop.org/software/"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/README.md",
    "/src",
]
keywords = ["bioinformatics", "genomics", "antimicrobial", "amr", "k-mer"]
categories = ["command-line-utilities", "science::bioinformatics", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bio = "2.3.0"
clap = { version = "4.5", features = ["derive"] }
orphos-core = { git = "https://github.com/vrbouza/orphos.git", branch = "victordev" }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
